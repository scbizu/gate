syntax = "proto3";

package anra.gate.a2a.extensions.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/anra-studio/gate/gen/anra/gate/a2a/extensions/v1;extensionsv1";

// These messages are encoded with ProtoJSON into an A2A Part.data value.
// The type field is a required discriminator and MUST equal the URI documented
// on each message. Extension URIs are negotiated through the A2A-Extensions
// request header and declared in AgentCard.capabilities.extensions.

// PermissionRequestBatch is self-contained so a client can approve a request
// even when it did not negotiate the optional tool-call extension.
message PermissionRequestBatch {
  // Must be https://anra.dev/a2a/extensions/acp-permission/v1/request.
  string type = 1;
  repeated PermissionRequest requests = 2;
}

message PermissionRequest {
  // An opaque, unguessable identifier generated by gate.
  string permission_id = 1;
  string title = 2;
  string description = 3;
  repeated PermissionOption options = 4;
  PermissionSubject subject = 5;
  google.protobuf.Timestamp expires_at = 6;
  // Digest of the immutable server-side request snapshot. This is useful for
  // audit correlation; clients MUST treat it as opaque.
  string snapshot_digest = 7;
}

message PermissionOption {
  string option_id = 1;
  string name = 2;
  PermissionOptionKind kind = 3;
}

enum PermissionOptionKind {
  PERMISSION_OPTION_KIND_UNSPECIFIED = 0;
  PERMISSION_OPTION_KIND_ALLOW_ONCE = 1;
  PERMISSION_OPTION_KIND_ALLOW_ALWAYS = 2;
  PERMISSION_OPTION_KIND_REJECT_ONCE = 3;
  PERMISSION_OPTION_KIND_REJECT_ALWAYS = 4;
}

message PermissionSubject {
  oneof subject {
    ToolCallSubject tool_call = 1;
  }
}

message ToolCallSubject {
  // The original ACP tool-call ID. gate MUST NOT synthesize this value.
  string tool_call_id = 1;
  string title = 2;
  string kind = 3;
}

message PermissionResponseBatch {
  // Must be https://anra.dev/a2a/extensions/acp-permission/v1/response.
  string type = 1;
  repeated PermissionResponse responses = 2;
}

message PermissionResponse {
  string permission_id = 1;
  string option_id = 2;
  // Echoes the request digest when supplied. A mismatch MUST fail closed.
  string snapshot_digest = 3;
}

message ToolCallUpdate {
  // Must be https://anra.dev/a2a/extensions/acp-tool-call/v1.
  string type = 1;
  // The original ACP tool-call ID. gate MUST NOT synthesize this value.
  string tool_call_id = 2;
  // Monotonically increasing within the A2A task event log.
  uint64 sequence = 3;
  ToolCallStatus status = 4;
  string title = 5;
  string kind = 6;
  // Sanitized tool content encoded as arbitrary ProtoJSON values. Keeping the
  // extension independent of the core A2A schema lets applications use the
  // official SDK without maintaining a local copy of the protocol schema.
  repeated google.protobuf.Value content = 7;
  repeated ToolCallLocation locations = 8;
}

enum ToolCallStatus {
  TOOL_CALL_STATUS_UNSPECIFIED = 0;
  TOOL_CALL_STATUS_PENDING = 1;
  TOOL_CALL_STATUS_IN_PROGRESS = 2;
  TOOL_CALL_STATUS_COMPLETED = 3;
  TOOL_CALL_STATUS_FAILED = 4;
}

message ToolCallLocation {
  string uri = 1;
  optional uint32 start_line = 2;
  optional uint32 end_line = 3;
}

message ThoughtChunk {
  // Must be https://anra.dev/a2a/extensions/acp-thought/v1.
  string type = 1;
  // Stable across all chunks belonging to the same thought.
  string thought_id = 2;
  // Monotonically increasing within the A2A task event log.
  uint64 sequence = 3;
  string delta = 4;
}
